apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
      - name: init-web
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
          - echo '<h1>Hello from Nginx Frontend</h1>' > /usr/share/nginx/html/index.html
        volumeMounts:
        - name: cache-volume
          mountPath: /usr/share/nginx/html
      containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
        - name: cache-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: cache-volume
        emptyDir:
          sizeLimit: 500Mi